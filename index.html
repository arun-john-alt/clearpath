  <noscript><div class="noscript-message">Please enable JavaScript to open Clearpath. Your information stays on this device unless you export it.</div></noscript>
  <script>
(function (root, factory) {

  'use strict';

  // This module intentionally contains no private example figures. The optional
  // personal starting data lives in seed.js, which is omitted from public builds.
  const SCHEMA_VERSION = 1;
  const MAX_MONEY = 1e12;
  const MAX_ROWS = 1200;
  const SYNTHETIC = new Set(['scenario-bonus', 'goal-education', 'goal-investment']);
  const KINDS = new Set(['income', 'expense', 'debt']);
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const round = value => Math.round((value + Number.EPSILON) * 100) / 100;
  const sum = values => round(values.reduce((total, value) => total + value, 0));
  const pad = value => String(value).padStart(2, '0');

  function daysInMonth(year, month) {
    if (month === 2) return year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0) ? 29 : 28;
    return [4, 6, 9, 11].includes(month) ? 30 : 31;
  }

  function validMonth(value) {
    return typeof value === 'string' && /^[0-9]{4}-(0[1-9]|1[0-2])$/.test(value)
      && Number(value.slice(0, 4)) > 0;
  }

  function validDate(value) {
    if (typeof value !== 'string' || !/^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$/.test(value)) return false;
    const [year, month, day] = value.split('-').map(Number);
    return year > 0 && day <= daysInMonth(year, month);
  }

  function localDate(date = new Date()) {
    if (!(date instanceof Date) || !Number.isFinite(date.getTime())) throw new RangeError('A valid Date is required.');
    return `${String(date.getFullYear()).padStart(4, '0')}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function monthOf(value) {
    if (value instanceof Date) return localDate(value).slice(0, 7);
    if (validMonth(value)) return value;
    if (validDate(value)) return value.slice(0, 7);
    throw new RangeError('Use a valid calendar date or month.');
  }

  function addMonths(month, count) {
    if (!validMonth(month) || !Number.isSafeInteger(count)) throw new RangeError('A valid month and integer month offset are required.');
    const [year, number] = month.split('-').map(Number);
    const index = year * 12 + number - 1 + count;
    const nextYear = Math.floor(index / 12);
    if (nextYear < 1 || nextYear > 9999) throw new RangeError('The resulting year is outside the supported calendar.');
    return `${String(nextYear).padStart(4, '0')}-${pad(index % 12 + 1)}`;
  }

  function monthDistance(from, to) {
    if (!validMonth(from) || !validMonth(to)) throw new RangeError('Use valid calendar months.');
    return (Number(to.slice(0, 4)) - Number(from.slice(0, 4))) * 12
      + Number(to.slice(5, 7)) - Number(from.slice(5, 7));
  }

  function dateInMonth(month, day) {
    const [year, number] = month.split('-').map(Number);
    return `${month}-${pad(Math.min(day, daysInMonth(year, number)))}`;
  }

  function money(value) {
    return typeof value === 'number' && Number.isFinite(value)
      ? new Intl.NumberFormat('en-IN', {style: 'currency', currency: 'INR', maximumFractionDigits: 0}).format(value)
      : '—';
  }

  function emptyState() {
    const now = new Date();
    const month = monthOf(now);
    const nextYear = now.getFullYear() + 1;
    return {
      schemaVersion: SCHEMA_VERSION,
      app: 'clearpath',
      updatedAt: now.toISOString(),
      settings: {
        name: '', startMonth: month, openingCash: null,
        liquidityFloor: 0, reserveTarget: 0, targetYear: nextYear + 8,
        educationMonthly: 0, investmentMonthly: 0, includeExpected: true,
        householdInflation: 0,
        scenario: {
          bonusEnabled: false, annualBonus: 0, bonusMonth: 12,
          bonusStartYear: nextYear, raiseEnabled: false, salaryGrowth: 0,
          raiseMonth: 4, raiseStartYear: nextYear, prepayShare: 50,
          extraStartMonth: `${nextYear}-01`
        },
        homeComparison: {principal: 0, rate: 0, startMonth: `${nextYear}-01`, baseYears: 9}
      },
      plans: [], loans: [], transactions: []
    };
  }

  function forecastMonths(state) {
    return Math.max(120, (state.settings.targetYear - Number(state.settings.startMonth.slice(0, 4)) + 2) * 12);
  }

  /**
   * Import boundary. Only the documented schema is copied; no object from an
   * untrusted backup is spread or merged into the application's state.
   * Invalid input returns state:null so callers cannot accidentally use it.
   */
  function validateState(raw) {
    const errors = [];
    const defaults = emptyState();
    const error = message => { if (errors.length < 100) errors.push(message); };
    if (!isObject(raw)) return {ok: false, errors: ['The backup must contain a state object.'], state: null};
    if (raw.schemaVersion !== SCHEMA_VERSION) error('Unsupported schemaVersion; expected 1.');
    if (raw.app !== 'clearpath') error('This is not a Clearpath backup.');

    function object(value, label, fallback) {
      if (value === undefined) return fallback;
      if (!isObject(value)) { error(`${label} must be an object.`); return fallback; }
      return value;
    }
    function text(value, label, fallback = '', max = 2000, required = false) {
      if (value === undefined) return fallback;
      if (typeof value !== 'string' || value.length > max || (required && !value.trim())) {
        error(`${label} must be ${required ? 'a nonempty' : 'a'} text value of at most ${max} characters.`);
        return fallback;
      }
      return value;
    }
    function number(value, label, fallback, min = 0, max = MAX_MONEY, integer = false, nullable = false) {
      if (value === undefined) return fallback;
      if (value === null && nullable) return null;
      if (typeof value !== 'number' || !Number.isFinite(value) || value < min || value > max || (integer && !Number.isSafeInteger(value))) {
        error(`${label} must be ${nullable ? 'null or ' : ''}a finite ${integer ? 'integer ' : ''}number from ${min} to ${max}.`);
        return fallback;
      }
      return value;
    }
    function bool(value, label, fallback) {
      if (value === undefined) return fallback;
      if (typeof value !== 'boolean') { error(`${label} must be true or false.`); return fallback; }
      return value;
    }
    function choice(value, allowed, label, fallback) {
      if (!allowed.has(value)) { error(`${label} is not a supported value.`); return fallback; }
      return value;
    }
    function date(value, label, fallback, nullable = false, monthOnly = false) {
      if (value === undefined) return fallback;
      if (value === null && nullable) return null;
      if (!(monthOnly ? validMonth(value) : validDate(value))) {
        error(`${label} must be ${nullable ? 'null or ' : ''}a valid ${monthOnly ? 'YYYY-MM month' : 'YYYY-MM-DD date'}.`);
        return fallback;
      }
      return value;
    }
    const ids = new Set();
    function id(value, label, nullable = false, reference = false) {
      if ((value === undefined || value === null) && nullable) return null;
      if (typeof value !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$/.test(value)) {
        error(`${label} must be a valid identifier.`);
        return '';
      }
      if (!reference) {
        if (ids.has(value)) error(`Duplicate identifier: ${value}.`);
        if (SYNTHETIC.has(value)) error(`${value} is reserved for a built-in allocation.`);
        ids.add(value);
      }
      return value;
    }
    function array(value, label, max) {
      if (!Array.isArray(value)) { error(`${label} must be an array.`); return []; }
      if (value.length > max) { error(`${label} exceeds the supported ${max} records.`); return []; }
      return value;
    }

    const s = object(raw.settings, 'settings', {});
    const sc = object(s.scenario, 'settings.scenario', {});
    const hc = object(s.homeComparison, 'settings.homeComparison', {});
    const ds = defaults.settings;
    const settings = {
      name: text(s.name, 'settings.name', ds.name, 100),
      startMonth: date(s.startMonth, 'settings.startMonth', ds.startMonth, false, true),
      openingCash: number(s.openingCash, 'settings.openingCash', null, -MAX_MONEY, MAX_MONEY, false, true),
      liquidityFloor: number(s.liquidityFloor, 'settings.liquidityFloor', 0),
      reserveTarget: number(s.reserveTarget, 'settings.reserveTarget', 0),
      targetYear: number(s.targetYear, 'settings.targetYear', ds.targetYear, 1, 9999, true),
      educationMonthly: number(s.educationMonthly, 'settings.educationMonthly', 0),
      investmentMonthly: number(s.investmentMonthly, 'settings.investmentMonthly', 0),
      includeExpected: bool(s.includeExpected, 'settings.includeExpected', true),
      householdInflation: number(s.householdInflation, 'settings.householdInflation', 0, 0, 100),
      scenario: {
        bonusEnabled: bool(sc.bonusEnabled, 'scenario.bonusEnabled', false),
        annualBonus: number(sc.annualBonus, 'scenario.annualBonus', 0),
        bonusMonth: number(sc.bonusMonth, 'scenario.bonusMonth', 12, 1, 12, true),
        bonusStartYear: number(sc.bonusStartYear, 'scenario.bonusStartYear', ds.scenario.bonusStartYear, 1, 9999, true),
        raiseEnabled: bool(sc.raiseEnabled, 'scenario.raiseEnabled', false),
        salaryGrowth: number(sc.salaryGrowth, 'scenario.salaryGrowth', 0, 0, 100),
        raiseMonth: number(sc.raiseMonth, 'scenario.raiseMonth', 4, 1, 12, true),
        raiseStartYear: number(sc.raiseStartYear, 'scenario.raiseStartYear', ds.scenario.raiseStartYear, 1, 9999, true),
        prepayShare: number(sc.prepayShare, 'scenario.prepayShare', 50, 0, 100),
        extraStartMonth: date(sc.extraStartMonth, 'scenario.extraStartMonth', ds.scenario.extraStartMonth, false, true)
      },
      homeComparison: {
        principal: number(hc.principal, 'homeComparison.principal', 0),
        rate: number(hc.rate, 'homeComparison.rate', 0, 0, 1000),
        startMonth: date(hc.startMonth, 'homeComparison.startMonth', ds.homeComparison.startMonth, false, true),
        baseYears: number(hc.baseYears, 'homeComparison.baseYears', 9, 1, 100, true)
      }
    };
    const startYear = Number(settings.startMonth.slice(0, 4));
    if (settings.targetYear < startYear || settings.targetYear > startYear + 98) {
      error('settings.targetYear must be between the snapshot year and 98 years after it.');
    }
    try {
      addMonths(settings.startMonth, Math.max(120, (settings.targetYear - startYear + 2) * 12) - 1);
      addMonths(settings.homeComparison.startMonth, settings.homeComparison.baseYears * 12 - 1);
    } catch (_) {
      error('The forecast horizon must remain within calendar years 0001 through 9999.');
    }

    const plans = array(raw.plans, 'plans', 5000).map((value, index) => {
      const p = object(value, `plans[${index}]`, {});
      const label = `plans[${index}]`;
      for (const key of ['id', 'name', 'kind', 'amount', 'frequency', 'start']) {
        if (!own(p, key)) error(`${label}.${key} is required.`);
      }
      const start = date(p.start, `${label}.start`, `${settings.startMonth}-01`);
      const end = date(p.end, `${label}.end`, null, true);
      if (end && end < start) error(`${label}.end cannot be before start.`);
      const frequency = choice(p.frequency, new Set(['monthly', 'annual', 'once']), `${label}.frequency`, 'once');
      const annualMonth = number(p.annualMonth, `${label}.annualMonth`, null, 1, 12, true, true);
      return {
        id: id(p.id, `${label}.id`), name: text(p.name, `${label}.name`, '', 200, true),
        kind: choice(p.kind, KINDS, `${label}.kind`, 'expense'),
        category: text(p.category, `${label}.category`, '', 100),
        amount: number(p.amount, `${label}.amount`, 0), frequency, start, end,
        dueDay: number(p.dueDay, `${label}.dueDay`, Number(start.slice(8)), 1, 31, true),
        annualMonth: frequency === 'annual' ? (annualMonth || Number(start.slice(5, 7))) : null,
        expected: bool(p.expected, `${label}.expected`, false),
        enabled: bool(p.enabled, `${label}.enabled`, true),
        loanId: id(p.loanId, `${label}.loanId`, true, true),
        note: text(p.note, `${label}.note`, '')
      };
    });

    const loans = array(raw.loans, 'loans', 5000).map((value, index) => {
      const l = object(value, `loans[${index}]`, {});
      const label = `loans[${index}]`;
      for (const key of ['id', 'name', 'balance', 'kind']) {
        if (!own(l, key)) error(`${label}.${key} is required.`);
      }
      return {
        id: id(l.id, `${label}.id`), name: text(l.name, `${label}.name`, '', 200, true),
        balance: number(l.balance, `${label}.balance`, 0),
        apr: number(l.apr, `${label}.apr`, null, 0, 1000, false, true),
        emi: number(l.emi, `${label}.emi`, null, 0, MAX_MONEY, false, true),
        kind: choice(l.kind, new Set(['home', 'personal', 'card', 'informal']), `${label}.kind`, 'personal'),
        maturity: date(l.maturity, `${label}.maturity`, null, true, true),
        target: date(l.target, `${label}.target`, null, true, true),
        note: text(l.note, `${label}.note`, ''),
        aprAssumed: bool(l.aprAssumed, `${label}.aprAssumed`, false)
      };
    });

    const transactions = array(raw.transactions, 'transactions', 50000).map((value, index) => {
      const t = object(value, `transactions[${index}]`, {});
      const label = `transactions[${index}]`;
      for (const key of ['id', 'type', 'amount', 'date']) {
        if (!own(t, key)) error(`${label}.${key} is required.`);
      }
      const actualDate = date(t.date, `${label}.date`, `${settings.startMonth}-01`);
      const transaction = {
        id: id(t.id, `${label}.id`), type: choice(t.type, KINDS, `${label}.type`, 'expense'),
        amount: number(t.amount, `${label}.amount`, 0), date: actualDate,
        description: text(t.description, `${label}.description`, '', 500),
        planId: id(t.planId, `${label}.planId`, true, true),
        period: date(t.period, `${label}.period`, actualDate.slice(0, 7), false, true),
        complete: bool(t.complete, `${label}.complete`, false),
        loanId: id(t.loanId, `${label}.loanId`, true, true),
        principal: number(t.principal, `${label}.principal`, null, 0, MAX_MONEY, false, true)
      };
      if (transaction.principal !== null) {
        if (transaction.type !== 'debt') error(`${label}.principal is only valid for a debt payment.`);
        if (!transaction.loanId) error(`${label}.principal needs a linked loan.`);
        if (transaction.principal > transaction.amount) error(`${label}.principal cannot exceed its cash payment.`);
      }
      if (transaction.loanId && transaction.type !== 'debt') error(`${label}.loanId is only valid for a debt payment.`);
      return transaction;
    });

    // Validate compounded values too: finite inputs can still overflow after
    // many annual increases. Scenario comparisons use growth even when the cash
    // forecast toggle is off, so include their full horizon here.
    const lastYear = Math.max(settings.targetYear + 1,
      startYear + 10, Number(settings.homeComparison.startMonth.slice(0, 4)) + settings.homeComparison.baseYears);
    for (const p of plans) {
      let factor = 1;
      if (p.kind === 'income' && p.category === 'salary') {
        factor = Math.pow(1 + settings.scenario.salaryGrowth / 100, Math.max(0, lastYear - settings.scenario.raiseStartYear + 1));
      }
      if (p.kind === 'expense' && p.category === 'household') {
        factor = Math.pow(1 + settings.householdInflation / 100, Math.max(0, lastYear - 2027));
      }
      if (!Number.isFinite(factor) || p.amount * factor > MAX_MONEY) {
        error(`Plan ${p.name || p.id} grows beyond the supported amount. Reduce the growth rate or forecast horizon.`);
      }
    }

    const loanIds = new Set(loans.map(l => l.id));
    const planMap = new Map(plans.map(p => [p.id, p]));
    for (const p of plans) {
      if (p.loanId && !loanIds.has(p.loanId)) error(`Plan ${p.name || p.id} references a missing loan.`);
      if (p.loanId && p.kind !== 'debt') error(`Plan ${p.name || p.id} can link a loan only when its kind is debt.`);
    }
    for (const t of transactions) {
      if (t.loanId && !loanIds.has(t.loanId)) error(`Transaction ${t.id} references a missing loan.`);
      if (!t.planId) continue;
      const p = planMap.get(t.planId);
      if (!p && !SYNTHETIC.has(t.planId)) {
        error(`Transaction ${t.id} references a missing plan. Unlink it to keep it as an unplanned actual.`);
        continue;
      }
      const expectedKind = p ? p.kind : t.planId === 'scenario-bonus' ? 'income' : 'expense';
      if (t.type !== expectedKind) error(`Transaction ${t.id} has a different type from its linked plan.`);
      if (p && p.loanId && t.loanId && p.loanId !== t.loanId) error(`Transaction ${t.id} links a different loan from its repayment plan.`);
    }

    let updatedAt = defaults.updatedAt;
    if (own(raw, 'updatedAt')) {
      if (typeof raw.updatedAt !== 'string' || raw.updatedAt.length > 60 || !Number.isFinite(Date.parse(raw.updatedAt))) {
        error('updatedAt must be a valid timestamp.');
      } else updatedAt = raw.updatedAt;
    }
    return errors.length
      ? {ok: false, errors, state: null}
      : {ok: true, errors: [], state: {schemaVersion: SCHEMA_VERSION, app: 'clearpath', updatedAt, settings, plans, loans, transactions}};
  }

  function raiseFactor(settings, month) {
    const sc = settings.scenario;
    const year = Number(month.slice(0, 4));
    const monthNumber = Number(month.slice(5, 7));
    const count = Math.max(0, year - sc.raiseStartYear + (monthNumber >= sc.raiseMonth ? 1 : 0));
    return Math.pow(1 + sc.salaryGrowth / 100, count);
  }

  function planOccurrence(plan, month, settings, options = {}) {
    if (!plan.enabled) return null;
    if (!options.ignoreExpected && plan.kind === 'income' && plan.expected && !settings.includeExpected) return null;
    let date;
    if (plan.frequency === 'once') {
      if (monthOf(plan.start) !== month) return null;
      date = plan.start;
    } else {
      if (plan.frequency === 'annual' && Number(month.slice(5, 7)) !== (plan.annualMonth || Number(plan.start.slice(5, 7)))) return null;
      date = dateInMonth(month, plan.dueDay);
      if (date < plan.start || (plan.end && date > plan.end)) return null;
    }
    if (date < plan.start || (plan.end && date > plan.end)) return null;
    let factor = 1;
    if (!options.noRaise && settings.scenario.raiseEnabled && plan.kind === 'income' && plan.category === 'salary') factor *= raiseFactor(settings, month);
    if (plan.kind === 'expense' && plan.category === 'household') {
      const years = Math.max(0, Number(month.slice(0, 4)) - 2027);
      factor *= Math.pow(1 + settings.householdInflation / 100, years);
    }
    return {...plan, date, period: month, amount: round(plan.amount * factor), baseAmount: plan.amount, synthetic: false};
  }

  function syntheticPlan(id, name, category, amount, kind, month, note) {
    const date = dateInMonth(month, 31);
    return {id, name, category, amount: round(amount), baseAmount: amount, kind,
      frequency: id === 'scenario-bonus' ? 'annual' : 'monthly', start: date, end: null,
      dueDay: 31, annualMonth: id === 'scenario-bonus' ? Number(month.slice(5, 7)) : null,
      expected: id === 'scenario-bonus', enabled: true, loanId: null, note,
      date, period: month, synthetic: true};
  }

  function occurrences(state, month) {
    if (!validMonth(month)) throw new RangeError('Use a valid forecast month.');
    if (month < state.settings.startMonth) return [];
    const settings = state.settings;
    const sc = settings.scenario;
    const items = state.plans.map(p => planOccurrence(p, month, settings)).filter(Boolean);
    if (sc.bonusEnabled && sc.annualBonus > 0 && Number(month.slice(0, 4)) >= sc.bonusStartYear
      && Number(month.slice(5, 7)) === sc.bonusMonth) {
      items.push(syntheticPlan('scenario-bonus', 'Annual bonus assumption', 'bonus', sc.annualBonus, 'income', month,
        'Conditional usable cash after tax. This assumption does not record a receipt or an extra loan payment.'));
    }
    if (settings.educationMonthly > 0) items.push(syntheticPlan('goal-education', 'Education allocation', 'education', settings.educationMonthly, 'expense', month,
      'A transfer out of available cash, counted once.'));
    if (settings.investmentMonthly > 0) items.push(syntheticPlan('goal-investment', 'Investment allocation', 'investment', settings.investmentMonthly, 'expense', month,
      'A transfer out of available cash, counted once.'));
    return items.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  }

  function transferType(planId, category) {
    if (planId === 'goal-education' || category === 'education') return 'education';
    if (planId === 'goal-investment' || category === 'investment') return 'investment';
    return null;
  }

  function groupActuals(state) {
    const eligible = state.transactions.filter(t => monthOf(t.date) >= state.settings.startMonth);
    const byMonth = new Map();
    const byOccurrence = new Map();
    for (const t of eligible) {
      const month = monthOf(t.date);
      if (!byMonth.has(month)) byMonth.set(month, []);
      byMonth.get(month).push(t);
      if (t.planId) {
        const key = `${t.planId}\u0000${t.period}`;
        if (!byOccurrence.has(key)) byOccurrence.set(key, []);
        byOccurrence.get(key).push(t);
      }
    }
    return {eligible, byMonth, byOccurrence};
  }

  function blankRow(month) {
    return {month, income: 0, expense: 0, debt: 0, education: 0, investment: 0,
      net: 0, cash: 0, actualIncome: 0, actualOut: 0, plannedIncome: 0, plannedOut: 0,
      actualExpense: 0, actualDebt: 0, actualEducation: 0, actualInvestment: 0,
      plannedExpense: 0, plannedDebt: 0, plannedEducation: 0, plannedInvestment: 0,
      events: [], breakdown: [], actuals: []};

  function monthlyRow(state, month, groups) {
    const row = blankRow(month);
    const planMap = new Map(state.plans.map(p => [p.id, p]));
    row.actuals = groups.byMonth.get(month) || [];
    for (const t of row.actuals) {
      const linked = planMap.get(t.planId);
      const transfer = t.type === 'expense' ? transferType(t.planId, linked && linked.category) : null;
      const field = t.type === 'income' ? 'actualIncome' : t.type === 'debt' ? 'actualDebt'
        : transfer === 'education' ? 'actualEducation' : transfer === 'investment' ? 'actualInvestment' : 'actualExpense';
      row[field] += t.amount;
      row.events.push({id: t.id, transactionId: t.id, planId: t.planId, source: 'actual',
        kind: t.type, category: transfer || (linked ? linked.category : 'unplanned'),
        name: t.description || (linked && linked.name) || (transfer ? `${transfer} transfer` : 'Recorded transaction'),
        date: t.date, period: t.period, amount: t.amount, actualAmount: t.amount,
        plannedAmount: 0, remainingAmount: 0, cashAmount: t.amount,

      const records = (groups.byOccurrence.get(`${item.id}\u0000${month}`) || []).filter(t => t.type === item.kind);

      const complete = records.some(t => t.complete);

      const transfer = item.kind === 'expense' ? transferType(item.id, item.category) : null;
      const field = item.kind === 'income' ? 'plannedIncome' : item.kind === 'debt' ? 'plannedDebt'
        : transfer === 'education' ? 'plannedEducation' : transfer === 'investment' ? 'plannedInvestment' : 'plannedExpense';

      if (remainingAmount > 0) row.events.push({...item, planId: item.id, source: 'planned',

        actualAmount, remainingAmount, status, complete, transfer});

    row.expense = round(row.actualExpense + row.plannedExpense);
    row.debt = round(row.actualDebt + row.plannedDebt);
    row.education = round(row.actualEducation + row.plannedEducation);
    row.investment = round(row.actualInvestment + row.plannedInvestment);
    row.actualOut = sum([row.actualExpense, row.actualDebt, row.actualEducation, row.actualInvestment]);
    row.plannedOut = sum([row.plannedExpense, row.plannedDebt, row.plannedEducation, row.plannedInvestment]);

  }

  function forecast(state, {months = 120} = {}) {
    if (!Number.isSafeInteger(months) || months < 1 || months > MAX_ROWS) throw new RangeError(`Forecast months must be an integer from 1 to ${MAX_ROWS}.`);
    const groups = groupActuals(state);
    const openingKnown = typeof state.settings.openingCash === 'number' && Number.isFinite(state.settings.openingCash);
    const openingUsed = openingKnown ? state.settings.openingCash : 0;
    const today = localDate();
    const recorded = groups.eligible.filter(t => t.date <= today);
    const futureActuals = groups.eligible.filter(t => t.date > today);
    const actualNet = sum(recorded.map(t => t.type === 'income' ? t.amount : -t.amount));
    const recordedCash = openingKnown ? round(openingUsed + actualNet) : null;
    const rows = [];
    let cash = openingUsed;
    let minimumCash = openingUsed;
    let firstShortfall = null;
    for (let index = 0; index < months; index++) {
      const month = addMonths(state.settings.startMonth, index);
      const row = monthlyRow(state, month, groups);
      cash = round(cash + row.net);
      row.cash = cash;
      rows.push(row);
      minimumCash = Math.min(minimumCash, cash);
      if (!firstShortfall && cash < 0) firstShortfall = row;
    }
    let premiums = 0;
    for (let index = 0; index < 12; index++) {
      premiums += sum(occurrences(state, addMonths(state.settings.startMonth, index))
        .filter(p => p.kind === 'expense' && p.category === 'premium' && p.frequency === 'annual').map(p => p.amount));
    }
    const warnings = [];
    if (!openingKnown) warnings.push('Opening accessible cash is unknown. Forecast cash starts provisionally at zero; recorded cash is not a known bank balance.');
    if (firstShortfall) warnings.push('The plan has an unfunded cash requirement. A negative projection does not create a loan or overdraft.');
    if (futureActuals.length) warnings.push(`${futureActuals.length} future-dated actual record(s) appear in the forecast, but are excluded from recorded cash until their date.`);
    if (groups.eligible.length !== state.transactions.length) warnings.push('Records before the opening snapshot month are excluded from cash, matching and principal tracking.');
    const expected = state.plans.some(p => p.enabled && p.kind === 'income' && p.expected);
    if (state.settings.includeExpected && expected) warnings.push('Expected income is included. Income amounts need to represent usable cash after tax and business costs.');
    if (state.settings.scenario.bonusEnabled || state.settings.scenario.raiseEnabled) warnings.push('Bonus and salary growth are optional assumptions, not guaranteed receipts. Home comparison prepayments do not automatically change this cash forecast.');
    const planMap = new Map(state.plans.map(p => [p.id, p]));
    let unmatched = 0;
    for (const t of groups.eligible) {
      if (!t.planId) continue;
      const p = planMap.get(t.planId);
      if (p && !planOccurrence({...p, enabled: true}, t.period, state.settings, {ignoreExpected: true})) unmatched++;
      if (!p && !SYNTHETIC.has(t.planId)) unmatched++;

    if (unmatched) warnings.push(`${unmatched} linked actual record(s) have no occurrence in their assigned period. Their cash is counted, but they do not settle another month's plan.`);

      recordedIncome: sum(recorded.filter(t => t.type === 'income').map(t => t.amount)),
      recordedOut: sum(recorded.filter(t => t.type !== 'income').map(t => t.amount)),
      futureActualCount: futureActuals.length, scheduledDebtTotal,
      actualDebtTotal: sum(rows.map(r => r.actualDebt)), remainingDebtTotal: sum(rows.map(r => r.plannedDebt)),
      annualPremiumReserve: round(premiums / 12), warnings, timing: 'month-end'};
  }

  function monthSummary(state, month) {
    const distance = monthDistance(state.settings.startMonth, month);
    if (distance < 0) {
      const row = blankRow(month);
      row.cash = state.settings.openingCash === null ? 0 : state.settings.openingCash;
      row.out = 0;
      return row;
    }
    return forecast(state, {months: distance + 1}).rows[distance];
  }

  function loanSummary(state) {
    const today = localDate();
    const eligible = state.transactions.filter(t => t.type === 'debt'
      && monthOf(t.date) >= state.settings.startMonth && t.date <= today);
    const loans = state.loans.map(loan => {
      const records = eligible.filter(t => t.loanId === loan.id);
      const principalPaid = sum(records.filter(t => t.principal !== null).map(t => t.principal));
      const missing = [];
      if (loan.apr === null) missing.push('rate');
      if (loan.emi === null) missing.push('EMI');
      return {...loan, principalPaid, cashPaid: sum(records.map(t => t.amount)),
        trackedBalance: round(Math.max(0, loan.balance - principalPaid)),
        principalExceedsOpening: principalPaid > loan.balance, missing};
    });
    const knownPrincipalPaid = sum(loans.map(l => l.principalPaid));
    const unallocatedDebtPayments = sum(eligible.filter(t => t.principal === null).map(t => t.amount));
    const warnings = [];
    if (loans.some(l => l.missing.length)) warnings.push('Some individual rates or EMIs are unknown. No complete debt-free date is calculated from these snapshots.');
    if (loans.some(l => l.aprAssumed)) warnings.push('Some interest rates are approximate assumptions.');
    if (unallocatedDebtPayments) warnings.push('Some recorded debt payments have no principal allocation, so they do not reduce tracked principal.');
    if (loans.some(l => l.principalExceedsOpening)) warnings.push('Recorded principal exceeds an opening balance. Check the snapshot date and allocations before relying on the tracked balance.');
    return {openingTotal: sum(loans.map(l => l.balance)), knownPrincipalPaid,
      trackedBalance: sum(loans.map(l => l.trackedBalance)),
      incomplete: loans.filter(l => l.missing.length && l.trackedBalance > 0).map(l => l.name),
      unknownRate: loans.filter(l => l.apr === null && l.trackedBalance > 0).map(l => l.name),
      unknownEmi: loans.filter(l => l.emi === null && l.trackedBalance > 0).map(l => l.name),
      unallocatedDebtPayments, unlinkedDebtPayments: sum(eligible.filter(t => !t.loanId).map(t => t.amount)),

      method: 'Opening principal less explicitly recorded principal; accrued interest and unallocated payments are not inferred.'};
  }

  function payment(principal, apr, months) {
    if (typeof principal !== 'number' || !Number.isFinite(principal) || principal < 0
      || typeof apr !== 'number' || !Number.isFinite(apr) || apr < 0

    if (apr === 0) return principal / months;
    const rate = apr / 1200;
    return principal * rate / -Math.expm1(-months * Math.log1p(rate));
  }

  function homeScenarios(state) {
    const home = state.settings.homeComparison;
    const sc = state.settings.scenario;
    if (!(home.principal > 0)) return [];
    const baseMonths = Math.round(home.baseYears * 12);
    const basePayment = payment(home.principal, home.rate, baseMonths);
    const variants = [
      {id: 'none', label: 'Base payment only', salary: false, bonus: false},
      {id: 'bonus', label: 'Bonus prepayments', salary: false, bonus: true},
      {id: 'raise', label: 'Salary-growth prepayments', salary: true, bonus: false},
      {id: 'both', label: 'Bonus and salary-growth prepayments', salary: true, bonus: true}
    ];
    return variants.map(variant => {
      let balance = home.principal;
      let interestTotal = 0;
      let totalPaid = 0;
      let extraPaid = 0;
      const rows = [];
      for (let index = 0; index < Math.min(baseMonths + 1, MAX_ROWS + 1) && balance > 0.000001; index++) {
        const month = addMonths(home.startMonth, index);
        const year = Number(month.slice(0, 4));
        const monthNumber = Number(month.slice(5, 7));
        const opening = balance;
        const interest = balance * home.rate / 1200;
        interestTotal += interest;
        balance += interest;
        const regular = Math.min(balance, basePayment);
        balance -= regular;
        const extrasAllowed = month >= sc.extraStartMonth;
        let salaryExtra = 0;
        if (extrasAllowed && variant.salary) {
          // Each enabled monthly salary rule is the baseline at that month.
          // Explicit salary phases remain separate from automatic growth.
          const salaryBase = state.plans.filter(p => p.kind === 'income' && p.category === 'salary' && p.frequency === 'monthly')
            .map(p => planOccurrence(p, month, state.settings, {noRaise: true, ignoreExpected: true}))
            .filter(Boolean).reduce((total, p) => total + p.amount, 0);
          salaryExtra = Math.max(0, salaryBase * (raiseFactor(state.settings, month) - 1) * sc.prepayShare / 100);
        }
        const raisePaid = Math.min(balance, salaryExtra);
        balance -= raisePaid;
        const bonusExtra = extrasAllowed && variant.bonus && year >= sc.bonusStartYear && monthNumber === sc.bonusMonth
          ? sc.annualBonus * sc.prepayShare / 100 : 0;
        const bonusPaid = Math.min(balance, bonusExtra);
        balance -= bonusPaid;
        if (balance < 0.000001) balance = 0;
        const paid = regular + raisePaid + bonusPaid;
        totalPaid += paid;
        extraPaid += raisePaid + bonusPaid;
        rows.push({month, opening, interest, regular, salaryExtra: raisePaid, bonusExtra: bonusPaid,
          extra: raisePaid + bonusPaid, payment: paid, principalPaid: paid - interest, balance});
      }
      const last = rows[rows.length - 1];
      return {id: variant.id, label: variant.label, payment: basePayment,
        payoffMonth: last && last.balance === 0 ? last.month : null,
        interest: interestTotal, months: rows.length, totalPaid, extraPaid, rows,
        principal: home.principal, apr: home.rate, extraStartMonth: sc.extraStartMonth,
        scope: 'Hypothetical home loans only; affordability and other debts are not modelled.'};
    });
  }

  return Object.freeze({emptyState, validateState, forecastMonths, localDate, monthOf, addMonths, monthDistance,
    money, occurrences, forecast, monthSummary, loanSummary, payment, homeScenarios});
});

  function upcoming() {
    const list=[];
    for(let i=0;i<15;i++) for(const e of CP.occurrences(state,CP.addMonths(today.slice(0,7),i))) {
      if(e.kind==='income'||e.date<today||['education','investment'].includes(e.category))continue;
      const ts=state.transactions.filter(t=>t.planId===e.id&&t.period===e.period&&t.date>=state.settings.startMonth+'-01');
      if(ts.some(t=>t.complete))continue;
      const paid=ts.reduce((s,t)=>s+t.amount,0);const remaining=Math.max(0,e.amount-paid);
      if(remaining)list.push({...e,amount:remaining});
    }
    return list.sort((a,b)=>a.date.localeCompare(b.date));
  }
  function cashChart(rows,height=240) {

    let min=Math.min(0,...vals),max=Math.max(floor,...vals,1);const range=max-min||1;min-=range*.08;max+=range*.08;
    const x=i=>pad.l+i*(w-pad.l-pad.r)/Math.max(1,rows.length-1),y=v=>pad.t+(max-v)/(max-min)*(h-pad.t-pad.b);
    const points=rows.map((r,i)=>x(i)+','+y(r.cash)).join(' '),zero=y(0);
    const ticks=[min<0?Math.min(...vals):0,(max+min)/2,Math.max(...vals,floor)];
    return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Projected available cash from '+monthLabel(rows[0].month)+' to '+monthLabel(rows.at(-1).month)+'. Lowest '+money(Math.min(...vals))+'."><title>Projected available cash, month end</title>'+ticks.map(v=>'<line class="chart-grid" x1="'+pad.l+'" y1="'+y(v)+'" x2="'+(w-pad.r)+'" y2="'+y(v)+'"/><text class="chart-label" x="'+(pad.l-9)+'" y="'+(y(v)+4)+'" text-anchor="end">'+esc(money(v,true))+'</text>').join('')+'<line class="chart-zero" x1="'+pad.l+'" y1="'+zero+'" x2="'+(w-pad.r)+'" y2="'+zero+'"/><polygon class="chart-area" points="'+x(0)+','+zero+' '+points+' '+x(rows.length-1)+','+zero+'"/><line class="chart-floor" x1="'+pad.l+'" y1="'+y(floor)+'" x2="'+(w-pad.r)+'" y2="'+y(floor)+'"/><polyline class="chart-line" points="'+points+'"/>'+rows.map((r,i)=>'<circle class="chart-point '+(r.cash<0?'negative':'')+'" cx="'+x(i)+'" cy="'+y(r.cash)+'" r="3"><title>'+monthLabel(r.month)+': '+money(r.cash)+'</title></circle>').join('')+[0,Math.floor((rows.length-1)/2),rows.length-1].map(i=>'<text class="chart-label" x="'+x(i)+'" y="'+(h-10)+'" text-anchor="'+(i===0?'start':i===rows.length-1?'end':'middle')+'">'+monthLabel(rows[i].month)+'</text>').join('')+'</svg><div class="chart-legend"><span><i class="legend-dot"></i> Month-end available cash</span><span><i class="legend-line"></i> Cash floor</span></div></div>';
  }

      if(typeof storedSnapshot!=='string'){toast('Stored data cannot be read. Restore browser storage access before replacing it.');return false;}
      download(storedSnapshot,'Clearpath-Recovery-'+CP.localDate()+'.json','application/json');
      toast('Original unreadable data downloaded for recovery. It has not been replaced.');
      return true;
    }
    download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'Clearpath-Backup-'+CP.localDate()+'.json','application/json');
    lastBackup=new Date().toISOString();try{localStorage.setItem(STORE+'.backup',lastBackup);}catch(_){}
    toast('Backup downloaded. Keep it somewhere safe.');if(view==='settings')render();return true;
  }
  async function readImport(file) {
    if(!file)return;
    if(file.size>100*1024*1024){toast('Choose a JSON backup smaller than 100 MB.');return;}
    try {
      const parsed=JSON.parse(await file.text()),imported=clean(parsed);
      pendingImport=imported;
      openDialog('Restore this setup?','This replaces the current plan on this device.', '<dl class="detail-list"><div><dt>Name</dt><dd>'+esc(imported.settings.name||'Not entered')+'</dd></div><div><dt>Plans</dt><dd>'+imported.plans.length+'</dd></div><div><dt>Loans</dt><dd>'+imported.loans.length+'</dd></div><div><dt>Actual entries</dt><dd>'+imported.transactions.length+'</dd></div></dl><p>Export your current plan first if you want to keep both. Imported descriptions are treated as text, never run as code.</p>',btn('Export current backup','backup','secondary')+btn('Cancel','close-dialog','ghost')+'<button class="button primary" type="submit" form="entryForm">Restore setup</button>',()=>{
        const old=clone(state),oldProblem=storageProblem;if(unreadableSavedData&&!backup())return;state=imported;storageProblem='';if(save('Setup restored on this device',old)){selectedMonth=today.slice(0,7)<state.settings.startMonth?state.settings.startMonth:today.slice(0,7);closeDialog();view='home';render();$('storageNotice')?.setAttribute('hidden','');}else{storageProblem=oldProblem||storageProblem;}
      });
    }catch(err){toast('Import rejected: '+err.message);}
    finally{$('backupFile').value='';}
  }
  function navigate(next){view=next;render();window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true});}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return;}
    const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
    if(a==='close-dialog')closeDialog();
    else if(a==='add-expense')transactionDialog('expense');
    else if(a==='add-income')transactionDialog('income');
    else if(a==='edit-entry'){const t=state.transactions.find(x=>x.id===id);if(t)transactionDialog(t.type,clone(t));}
    else if(a==='delete-entry')removeEntry(id);
    else if(a==='pay-plan'){const p=state.plans.find(x=>x.id===id);if(p)transactionDialog(p.kind,null,{planId:id,period:b.dataset.period});}
    else if(a==='pay-loan')transactionDialog('debt',null,{loanId:id});
    else if(a==='add-plan')planDialog(null,{kind:b.dataset.kind||'expense'});
    else if(a==='add-event')planDialog(null,{frequency:'once'});
    else if(a==='edit-plan'){const p=state.plans.find(x=>x.id===id);if(p)planDialog(clone(p));}
    else if(a==='delete-plan')removePlan(id);
    else if(a==='add-loan')loanDialog();
    else if(a==='edit-loan'){const l=state.loans.find(x=>x.id===id);if(l)loanDialog(clone(l));}
    else if(a==='delete-loan')removeLoan(id);
    else if(a==='opening')openingDialog();
    else if(a==='goals-edit')goalsDialog();
    else if(a==='assumptions')assumptionsDialog();
    else if(a==='scenario-edit')assumptionsDialog(true);
    else if(a==='backup')backup();
    else if(a==='import')$('backupFile').click();
    else if(a==='settings'||a==='go-settings')navigate('settings');
    else if(a==='go-activity')navigate('activity');
    else if(a==='go-loans')navigate('loans');
    else if(a==='go-plan'){planTab='forecast';navigate('plan');}
    else if(a==='scenarios'){planTab='scenarios';navigate('plan');}
    else if(a==='recurring'){planTab='recurring';navigate('plan');}
    else if(a==='plan-tab'){planTab=id;render();}
    else if(a==='activity-filter'){activityFilter=id;render();}
    else if(a==='show-month'){selectedMonth=b.dataset.month;navigate('home');}
    else if(a==='undo'&&undoState){const current=clone(state),target=undoState;state=clone(target);if(save('Change undone',current))undoState=null;else undoState=target;}
    else if(a==='reset')confirmDialog('Reset this planner?','<p>This removes your plan, loans and actual entries from this browser. Export a backup before continuing.</p>','Reset planner',()=>{const prev=clone(state),oldProblem=storageProblem;if(unreadableSavedData&&!backup())return;state=CP.emptyState();storageProblem='';if(save('Planner reset',prev)){closeDialog();$('storageNotice')?.setAttribute('hidden','');navigate('home');}else{storageProblem=oldProblem||storageProblem;}});
  });
  document.addEventListener('change',e=>{if(e.target.id==='viewMonth'){const v=e.target.value;if(/^\d{4}-(0[1-9]|1[0-2])$/.test(v)&&v>=state.settings.startMonth&&v<=CP.addMonths(state.settings.startMonth,CP.forecastMonths(state)-1)){selectedMonth=v;render();}}if(e.target.id==='forecastYear'){forecastYear=e.target.value;render();}if(e.target.id==='backupFile')readImport(e.target.files[0]);});
  document.addEventListener('input',e=>{if(e.target.id==='activitySearch'){activitySearch=e.target.value;const pos=e.target.selectionStart;render();$('activitySearch').focus();$('activitySearch').setSelectionRange(pos,pos);}});
  $('editor').addEventListener('click',e=>{if(e.target===$('editor')){const r=$('editor').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
  $('editor').addEventListener('cancel',()=>{pendingImport=null;});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today!==CP.localDate()){today=CP.localDate();forecastCache=null;render();}});
  load();render();
})();

  </script>
</body>
</html>
